<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Rogue-rs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: #0d0d0d;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    canvas {
      display: block;
      border: 2px solid #3a3a3a;
      box-shadow: 0 0 40px rgba(80, 120, 80, 0.25),
                  0 0  8px rgba(0,   0,  0, 0.8);
    }
    #err {
      color: #f55; background: #111; font-family: monospace; font-size: 13px;
      padding: 12px; white-space: pre; position: fixed; top: 0; left: 0;
      max-width: 100%; z-index: 10; display: none;
    }
  </style>
</head>
<body>
  <div id="err"></div>
  <canvas id="glcanvas" tabindex="1" width="800" height="448"></canvas>
  <script>
    // Pre-declare globals that mq_js_bundle.js's quad_net plugin assigns to
    // without a var/let declaration (causes ReferenceError in strict mode).
    var register_plugin;

    function showErr(msg) {
      var d = document.getElementById('err');
      d.style.display = 'block';
      d.textContent += msg + '\n';
    }
    window.onerror = function(msg, src, line, col, err) {
      showErr('JS Error: ' + msg + '\n' + (err && err.stack || ''));
    };
    window.onunhandledrejection = function(e) {
      showErr('Promise rejection: ' + e.reason);
    };
  </script>
  <script src="mq_js_bundle.js?v=3"></script>
  <script>load("rogue-web.wasm?v=7");</script>
</body>
</html>
