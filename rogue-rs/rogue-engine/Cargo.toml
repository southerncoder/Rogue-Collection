[package]
name = "rogue-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Platform-neutral game loop, state machine, and renderer for the modern Rust Rogue."

[dependencies]
rogue-core = { path = "../rogue-core" }
hecs = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
