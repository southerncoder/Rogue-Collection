[workspace]
resolver = "2"
members = ["rogue-core", "rogue-engine", "rogue-cli", "rogue-web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Rogue Collection contributors"]

[workspace.dependencies]
bracket-lib = "0.8"
hecs = "0.10"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
rand = "0.8"
